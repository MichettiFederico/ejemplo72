<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2e7d32;
    --primary-hover: #388e3c;
    --primary-light: rgba(46, 125, 50, 0.25);
    --bg: #000000;
    --card-bg: #0a0a0c;
    --card-border: #1e1e24;
    --card-border-hover: #3a3a45;
    --text: #ffffff;
    --muted: #a1a1aa;
    --accent: #ff6b35;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding-bottom: 110px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: linear-gradient(180deg, #141419 0%, #000000 100%);
    color: white;
    padding: 40px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--card-border);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(34, 197, 94, 0.15);
    color: #4ade80;
    border: 1px solid rgba(34, 197, 94, 0.3);
    padding: 4px 12px;
    border-radius: 99px;
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 8px #22c55e;
  }

  header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  header p {
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 500;
  }

  /* Buscador & Categorías */
  .top-controls {
    position: sticky;
    top: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
    padding: 12px 0;
    border-bottom: 1px solid var(--card-border);
  }

  .search-container {
    max-width: 800px;
    margin: 0 auto 10px;
    padding: 0 16px;
  }

  .search-input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 14px;
    border: 1px solid #272730;
    background: #121216;
    color: white;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus {
    border-color: var(--primary);
  }

  .categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 16px;
    max-width: 800px;
    margin: 0 auto;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    flex: 0 0 auto;
    padding: 8px 18px;
    border-radius: 99px;
    background: #121216;
    border: 1px solid #272730;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .cat-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.45);
  }

  /* Main & Grid */
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 10px 16px;
  }

  .section-title {
    font-size: 1.35rem;
    font-weight: 800;
    margin: 28px 0 16px;
    color: #ffffff;
    letter-spacing: -0.3px;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }

  /* Tarjeta de Producto */
  .item {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    position: relative;
  }

  .item:hover {
    transform: translateY(-4px);
    border-color: var(--card-border-hover);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
  }

  .product-tag {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    z-index: 2;
  }

  .item-img-container {
    width: 100%;
    height: 195px;
    overflow: hidden;
    position: relative;
    background: #18181b;
  }

  .item-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .item:hover .item-img {
    transform: scale(1.04);
  }

  .item-content {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
    justify-content: space-between;
  }

  .item-info h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #ffffff;
  }

  .item-info p {
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.45;
  }

  .item-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
  }

  .item-price {
    font-weight: 800;
    color: #ffffff;
    font-size: 1.15rem;
  }

  /* Botones de acción */
  .add-btn {
    background: var(--primary-light);
    color: #4ade80;
    border: 1px solid rgba(74, 222, 128, 0.35);
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .add-btn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
  }

  .add-btn:active { transform: scale(0.96); }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--primary);
    border-radius: 12px;
    padding: 4px 8px;
    box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
  }

  .qty-control button {
    background: rgba(255, 255, 255, 0.22);
    border: none;
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .qty-control span {
    color: white;
    font-weight: 800;
    min-width: 18px;
    text-align: center;
    font-size: 0.95rem;
  }

  /* Carrito Flotante */
  .cart-bar {
    position: fixed;
    bottom: 20px;
    left: 16px;
    right: 16px;
    max-width: 500px;
    margin: 0 auto;
    background: #121216;
    border: 1px solid #2a2a35;
    color: white;
    padding: 14px 22px;
    border-radius: 22px;
    display: none;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 12px 35px rgba(0,0,0,0.95);
    z-index: 100;
    transition: transform 0.2s, background-color 0.2s;
  }

  .cart-bar:hover { background: #18181f; border-color: #3f3f50; }
  .cart-bar:active { transform: scale(0.98); }
  .cart-bar.show { display: flex; }

  .cart-bar .left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
  }

  .cart-count {
    background: var(--accent);
    border-radius: 99px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 800;
  }

  /* Modal Carrito */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }

  .overlay.show { display: flex; }

  .cart-modal {
    background: #0a0a0c;
    color: white;
    width: 100%;
    max-width: 600px;
    max-height: 88vh;
    border-radius: 28px 28px 0 0;
    border-top: 1px solid #272730;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .cart-header {
    padding: 20px 24px;
    border-bottom: 1px solid #1c1c24;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cart-header h2 { font-size: 1.3rem; font-weight: 800; }

  .close-btn {
    background: #18181e;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    color: var(--muted);
  }

  .cart-items {
    overflow-y: auto;
    padding: 16px 24px;
    flex: 1;
  }

  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #18181e;
  }

  .cart-item-name { font-weight: 700; font-size: 0.95rem; }
  .cart-item-price { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }

  .cart-item-remove {
    background: rgba(239, 68, 68, 0.15);
    border: none;
    color: #ef4444;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }

  .empty-cart {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-weight: 500;
  }

  .cart-footer {
    padding: 20px 24px 28px;
    border-top: 1px solid #18181e;
    background: #000000;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    font-size: 1.25rem;
    font-weight: 800;
    margin-bottom: 18px;
  }

  .form-group { margin-bottom: 12px; }

  .form-group label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #272730;
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #121216;
    color: white;
    outline: none;
  }

  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: var(--primary);
  }

  .checkout-btn {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.35);
  }

  .checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <div class="status-badge">
    <span class="status-dot"></span>
    Abierto hoy de 19:00 a 00:00 hs
  </div>
  <h1>🍔 Mi Negocio</h1>
  <p>Hacé tu pedido online y te lo confirmamos por WhatsApp</p>
</header>

<div class="top-controls">
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar producto..." oninput="filterMenu()">
  </div>
  <div class="categories" id="categories"></div>
</div>

<main id="menu"></main>

<div class="cart-bar" id="cartBar" onclick="openCart()">
  <div class="left">
    <span class="cart-count" id="cartCount">0</span>
    <span>Ver mi pedido</span>
  </div>
  <div id="cartBarTotal" style="font-weight: 800; font-size: 1.1rem;">$0</div>
</div>

<div class="overlay" id="overlay" onclick="closeCartOutside(event)">
  <div class="cart-modal">
    <div class="cart-header">
      <h2>Tu pedido</h2>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="total-row">
        <span>Total</span>
        <span id="cartTotal">$0</span>
      </div>

      <div class="form-group">
        <label>Tu nombre</label>
        <input type="text" id="custName" placeholder="Ej: Juan Pérez">
      </div>
      
      <div class="form-group">
        <label>Modalidad de Entrega</label>
        <select id="custMode">
          <option value="Retiro en local">Retiro en local</option>
          <option value="Envío a domicilio">Envío a domicilio</option>
        </select>
      </div>

      <div class="form-group" id="addressGroup" style="display:none;">
        <label>Dirección de envío</label>
        <input type="text" id="custAddress" placeholder="Calle, número, piso/depto...">
      </div>

      <div class="form-group">
        <label>Método de Pago</label>
        <select id="custPayment">
          <option value="Mercado Pago / Transferencia">Mercado Pago / Transferencia</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Tarjeta de Débito/Crédito">Tarjeta de Débito / Crédito</option>
        </select>
      </div>

      <div class="form-group" id="cashGroup" style="display:none;">
        <label>Pagas en efectivo ¿Con cuánto abonás?</label>
        <input type="text" id="custChange" placeholder="Ej: Pago con $10.000 para llevar cambio">
      </div>

      <div class="form-group">
        <label>Aclaraciones / Notas (opcional)</label>
        <textarea id="custNotes" rows="2" placeholder="Ej: Sin cebolla, aderezo aparte..."></textarea>
      </div>

      <button class="checkout-btn" id="checkoutBtn" onclick="enviarPedido()">
        📲 Enviar pedido por WhatsApp
      </button>
    </div>
  </div>
</div>

<footer>NOMBRE DE EMPRESA</footer>

<script>
/* ============================================================
   CONFIGURACIÓN Y DATOS
   ============================================================ */

const WHATSAPP_NUMBER = "5492281552807"; 

const MENU = [
  {
    categoria: "Hamburguesas",
    productos: [
      { 
        id: 1, 
        nombre: "Hamburguesa Clásica", 
        desc: "Carne jugosa, queso cheddar, lechuga fresca, tomate y salsa especial.", 
        precio: 4500,
        tag: "🔥 Más Vendida",
        imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800&q=80" 
      },
      { 
        id: 2, 
        nombre: "Hamburguesa Doble Cheddar", 
        desc: "Doble carne artesanal, doble queso cheddar fundido y panceta crocante.", 
        precio: 6200,
        tag: "⭐ Recomendado",
        imagen: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=800&q=80" 
      },
      { 
        id: 3, 
        nombre: "Hamburguesa Veggie", 
        desc: "Medallón de garbanzos y especias, palta fresca, rúcula y mayo veggie.", 
        precio: 4800,
        tag: "🌱 Veggie",
        imagen: "https://images.unsplash.com/photo-1525059696034-4967a8e1dca2?w=800&q=80" 
      },
    ]
  },
  {
    categoria: "Papas",
    productos: [
      { 
        id: 4, 
        nombre: "Papas Fritas Tradicionales", 
        desc: "Porción individual súper crocantes y doradas.", 
        precio: 2200,
        imagen: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=800&q=80" 
      },
      { 
        id: 5, 
        nombre: "Papas Cheddar & Bacon", 
        desc: "Porción abundante bañada en queso cheddar y panceta tostada.", 
        precio: 3500,
        tag: "🔥 Populares",
        imagen: "https://images.unsplash.com/photo-1585109649139-366815a0d713?w=800&q=80" 
      },
    ]
  },
  {
    categoria: "Bebidas",
    productos: [
      { 
        id: 6, 
        nombre: "Gaseosa 500ml", 
        desc: "Línea Coca-Cola helada (especificar sabor en aclaraciones).", 
        precio: 1800,
        imagen: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=800&q=80" 
      },
      { 
        id: 7, 
        nombre: "Cerveza Artesanal", 
        desc: "Lata 473ml helada - Estilos disponibles: IPA / Honey / APA.", 
        precio: 3200,
        imagen: "https://images.unsplash.com/photo-1608270586620-248524c67de9?w=800&q=80" 
      },
    ]
  },
];

/* ============================================================
   ESTADO Y LÓGICA
   ============================================================ */

// Cargar carrito del localStorage
let cart = JSON.parse(localStorage.getItem("menu_cart") || "{}");

function saveCart() {
  localStorage.setItem("menu_cart", JSON.stringify(cart));
}

function formatPrice(n) {
  return "$" + n.toLocaleString("es-AR");
}

function renderCategories() {
  const cont = document.getElementById("categories");
  cont.innerHTML = "";
  MENU.forEach((cat, idx) => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (idx === 0 ? " active" : "");
    btn.textContent = cat.categoria;
    btn.onclick = () => {
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("cat-" + idx).scrollIntoView({ behavior: "smooth", block: "start" });
    };
    cont.appendChild(btn);
  });
}

function renderMenu(filterText = "") {
  const main = document.getElementById("menu");
  main.innerHTML = "";

  MENU.forEach((cat, idx) => {
    const filteredProds = cat.productos.filter(p => 
      p.nombre.toLowerCase().includes(filterText.toLowerCase()) || 
      p.desc.toLowerCase().includes(filterText.toLowerCase())
    );

    if (filteredProds.length === 0) return;

    const title = document.createElement("div");
    title.className = "section-title";
    title.id = "cat-" + idx;
    title.textContent = cat.categoria;
    main.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "products-grid";

    filteredProds.forEach(prod => {
      const item = document.createElement("div");
      item.className = "item";
      
      const tagHTML = prod.tag ? `<div class="product-tag">${prod.tag}</div>` : '';
      const imgHTML = prod.imagen 
        ? `<div class="item-img-container">${tagHTML}<img src="${prod.imagen}" alt="${prod.nombre}" class="item-img" loading="lazy"></div>` 
        : '';

      item.innerHTML = `
        ${imgHTML}
        <div class="item-content">
          <div class="item-info">
            <h3>${prod.nombre}</h3>
            <p>${prod.desc}</p>
          </div>
          <div class="item-bottom">
            <div class="item-price">${formatPrice(prod.precio)}</div>
            <div class="controls" id="controls-${prod.id}"></div>
          </div>
        </div>
      `;
      grid.appendChild(item);
    });

    main.appendChild(grid);
    filteredProds.forEach(prod => renderControls(prod));
  });
}

function filterMenu() {
  const text = document.getElementById("searchInput").value;
  renderMenu(text);
}

function renderControls(prod) {
  const cont = document.getElementById("controls-" + prod.id);
  if (!cont) return;
  const inCart = cart[prod.id];
  if (!inCart) {
    cont.innerHTML = `<button class="add-btn" onclick="addToCart(${prod.id})">Agregar</button>`;
  } else {
    cont.innerHTML = `
      <div class="qty-control">
        <button onclick="changeQty(${prod.id}, -1)">−</button>
        <span>${inCart.cantidad}</span>
        <button onclick="changeQty(${prod.id}, 1)">+</button>
      </div>
    `;
  }
}

function findProduct(id) {
  for (const cat of MENU) {
    const p = cat.productos.find(p => p.id === id);
    if (p) return p;
  }
}

function addToCart(id) {
  const prod = findProduct(id);
  cart[id] = { producto: prod, cantidad: 1 };
  saveCart();
  renderControls(prod);
  updateCartBar();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].cantidad += delta;
  if (cart[id].cantidad <= 0) {
    delete cart[id];
  }
  saveCart();
  renderControls(findProduct(id));
  updateCartBar();
  renderCartModal();
}

function getTotal() {
  return Object.values(cart).reduce((sum, c) => sum + c.producto.precio * c.cantidad, 0);
}

function getCount() {
  return Object.values(cart).reduce((sum, c) => sum + c.cantidad, 0);
}

function updateCartBar() {
  const bar = document.getElementById("cartBar");
  const count = getCount();
  document.getElementById("cartCount").textContent = count;
  document.getElementById("cartBarTotal").textContent = formatPrice(getTotal());
  bar.classList.toggle("show", count > 0);
}

function renderCartModal() {
  const cont = document.getElementById("cartItems");
  const entries = Object.values(cart);
  if (entries.length === 0) {
    cont.innerHTML = `<div class="empty-cart">Tu carrito está vacío 🛒</div>`;
    document.getElementById("checkoutBtn").disabled = true;
  } else {
    cont.innerHTML = entries.map(c => `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${c.cantidad}x ${c.producto.nombre}</div>
          <div class="cart-item-price">${formatPrice(c.producto.precio * c.cantidad)}</div>
        </div>
        <button class="cart-item-remove" onclick="changeQty(${c.producto.id}, -${c.cantidad})">Eliminar</button>
      </div>
    `).join("");
    document.getElementById("checkoutBtn").disabled = false;
  }
  document.getElementById("cartTotal").textContent = formatPrice(getTotal());
}

function openCart() {
  renderCartModal();
  document.getElementById("overlay").classList.add("show");
}

function closeCart() {
  document.getElementById("overlay").classList.remove("show");
}

function closeCartOutside(e) {
  if (e.target.id === "overlay") closeCart();
}

// Controladores para mostrar campos dinámicos
document.getElementById("custMode").addEventListener("change", (e) => {
  document.getElementById("addressGroup").style.display =
    e.target.value === "Envío a domicilio" ? "block" : "none";
});

document.getElementById("custPayment").addEventListener("change", (e) => {
  document.getElementById("cashGroup").style.display =
    e.target.value === "Efectivo" ? "block" : "none";
});

// Enviar a WhatsApp con Ticket
function enviarPedido() {
  const entries = Object.values(cart);
  if (entries.length === 0) return;

  const nombre = document.getElementById("custName").value.trim();
  const modo = document.getElementById("custMode").value;
  const direccion = document.getElementById("custAddress").value.trim();
  const pago = document.getElementById("custPayment").value;
  const cambio = document.getElementById("custChange").value.trim();
  const notas = document.getElementById("custNotes").value.trim();

  if (!nombre) {
    alert("Por favor ingresá tu nombre");
    return;
  }
  if (modo === "Envío a domicilio" && !direccion) {
    alert("Por favor ingresá la dirección de envío");
    return;
  }

  // Generar ID de pedido aleatorio
  const orderId = "#PED-" + Math.floor(1000 + Math.random() * 9000);

  let mensaje = `📋 *NUEVO PEDIDO ${orderId}*\n\n`;
  entries.forEach(c => {
    mensaje += `• ${c.cantidad}x ${c.producto.nombre} — ${formatPrice(c.producto.precio * c.cantidad)}\n`;
  });
  mensaje += `\n*TOTAL: ${formatPrice(getTotal())}*\n\n`;
  mensaje += `👤 *Cliente:* ${nombre}\n`;
  mensaje += `📦 *Modalidad:* ${modo}\n`;
  if (modo === "Envío a domicilio") {
    mensaje += `📍 *Dirección:* ${direccion}\n`;
  }
  mensaje += `💳 *Pago:* ${pago}\n`;
  if (pago === "Efectivo" && cambio) {
    mensaje += `💵 *Abona con:* ${cambio}\n`;
  }
  if (notas) {
    mensaje += `📝 *Aclaraciones:* ${notas}\n`;
  }

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
  
  // Limpiar carrito al enviar
  cart = {};
  saveCart();
  
  window.open(url, "_blank");
  location.reload();
}

// Inicialización
renderCategories();
renderMenu();
updateCartBar();
</script>
