<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2e7d32;
    --primary-hover: #388e3c;
    --primary-light: rgba(46, 125, 50, 0.25);
    --dark: #1b4332;
    --bg: #000000;
    --card-bg: #0a0a0c;
    --card-border: #1e1e24;
    --card-border-hover: #3a3a45;
    --text: #ffffff;
    --muted: #a1a1aa;
    --accent: #ff6b35;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding-bottom: 110px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    background: linear-gradient(180deg, #141419 0%, #000000 100%);
    color: white;
    padding: 50px 20px 32px;
    text-align: center;
    border-bottom: 1px solid var(--card-border);
  }

  header h1 {
    font-size: 2.3rem;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  header p {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 500;
  }

  /* Categorías */
  .categories-wrapper {
    position: sticky;
    top: 0;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
    padding: 14px 0;
    border-bottom: 1px solid var(--card-border);
  }

  .categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 16px;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }

  .cat-btn {
    flex: 0 0 auto;
    padding: 10px 22px;
    border-radius: 99px;
    background: #121216;
    border: 1px solid #272730;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .cat-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.45);
  }

  /* Main & Grid */
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 10px 16px;
  }

  .section-title {
    font-size: 1.35rem;
    font-weight: 800;
    margin: 32px 0 18px;
    color: #ffffff;
    letter-spacing: -0.3px;
  }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }

  /* Tarjeta de Producto */
  .item {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .item:hover {
    transform: translateY(-4px);
    border-color: var(--card-border-hover);
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
  }

  .item-img-container {
    width: 100%;
    height: 195px;
    overflow: hidden;
    position: relative;
    background: #18181b;
  }

  .item-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .item:hover .item-img {
    transform: scale(1.04);
  }

  .item-content {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
    justify-content: space-between;
  }

  .item-info h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #ffffff;
  }

  .item-info p {
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.45;
  }

  .item-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
  }

  .item-price {
    font-weight: 800;
    color: #ffffff;
    font-size: 1.15rem;
  }

  /* Botones de acción */
  .add-btn {
    background: var(--primary-light);
    color: #4ade80;
    border: 1px solid rgba(74, 222, 128, 0.35);
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .add-btn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
  }

  .add-btn:active {
    transform: scale(0.96);
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--primary);
    border-radius: 12px;
    padding: 4px 8px;
    box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
  }

  .qty-control button {
    background: rgba(255, 255, 255, 0.22);
    border: none;
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }

  .qty-control button:hover {
    background: rgba(255, 255, 255, 0.35);
  }

  .qty-control span {
    color: white;
    font-weight: 800;
    min-width: 18px;
    text-align: center;
    font-size: 0.95rem;
  }

  /* Carrito Flotante */
  .cart-bar {
    position: fixed;
    bottom: 20px;
    left: 16px;
    right: 16px;
    max-width: 500px;
    margin: 0 auto;
    background: #121216;
    border: 1px solid #2a2a35;
    color: white;
    padding: 14px 22px;
    border-radius: 22px;
    display: none;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 12px 35px rgba(0,0,0,0.95);
    z-index: 100;
    transition: transform 0.2s, background-color 0.2s;
  }

  .cart-bar:hover {
    background: #18181f;
    border-color: #3f3f50;
  }

  .cart-bar:active { transform: scale(0.98); }
  .cart-bar.show { display: flex; }

  .cart-bar .left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
  }

  .cart-count {
    background: var(--accent);
    border-radius: 99px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 800;
  }

  /* Modal Carrito */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 200;
  }

  .overlay.show { display: flex; }

  .cart-modal {
    background: #0a0a0c;
    color: white;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    border
